<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дорога и книга</title>
  
</head>
<body>

  <!-- Основной контент сайта -->
  <div class="main-content">
    <h1>Добро пожаловать!</h1>
    <p>Анимация завершена.</p>
  </div>

  <!-- Сцена с дорогой и книгой -->
  <div class="scene">
    <div class="road-container">
      <div class="road">
        <div class="route"></div>
      </div>
    </div>

    <div class="book-wrapper">
      <div class="book">
        <div class="book-back"></div>
        <div class="book-page-base">✦ ✦ ✦</div>
        
        <!-- Двусторонняя обложка -->
        <div class="book-cover">
          <div class="cover-front"></div>
          <div class="cover-inside"></div>
        </div>

        <!-- Расширяющаяся страница -->
        <div class="expanding-page"></div>
      </div>
    </div>
  </div>

</body>
</html>
